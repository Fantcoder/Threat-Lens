[project]
name = "threatlens"
version = "1.0.0"
description = "Threat Intelligence Aggregator — query, normalize, and score IoCs across multiple providers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
authors = [{name = "Fantcoder"}]
keywords = ["threat-intelligence", "cybersecurity", "ioc", "virustotal", "async", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "tenacity>=9.2.1,<10",
    "aiosqlite>=0.22.1,<1",
    "typer>=0.12,<1",
    "rich>=15.0.0,<16",
    "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=5,<6",
    "respx>=0.23.1,<1",
    "hypothesis>=6.100,<7",
    "ruff>=0.17.2,<1",
    "mypy>=2.4.0,<3",
    "bandit>=1.9.4,<2",
    "pip-audit>=2.7,<3",
]

[project.scripts]
threatlens = "threatlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens"]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "A",              # flake8-builtins
    "S",              # flake8-bandit
    "T20",            # flake8-print
    "SIM",            # flake8-simplify
    "RUF",            # ruff-specific
]
ignore = [
    "S101",   # assert allowed in tests
    "S311",   # random not used for crypto
    "A003",   # shadowing builtins in models is fine (id, type, etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S106", "T201"]
"scripts/**" = ["T201", "S101"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=src/threatlens",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--strict-markers",
    "-v",
]
markers = [
    "slow: marks tests as slow",
]

# ---------- bandit ----------
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B104"]

# ---------- coverage ----------
[tool.coverage.run]
source = ["src/threatlens"]
omit = ["src/threatlens/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@overload",
    "raise NotImplementedError",
]


