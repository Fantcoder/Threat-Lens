services:
  threatlens:
    build:
      context: .
      dockerfile: Dockerfile
    image: threatlens:latest
    container_name: threatlens
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - THREATLENS_CACHE_DIR=/app/data
      - THREATLENS_HOST=0.0.0.0
      - THREATLENS_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
